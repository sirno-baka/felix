[package]
name = "felix-rhai"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rhai"
path = "src/main.rs"

[dependencies]
rhai = { version = "1.26", default-features = false, features = ["std", "only_i64", "no_float", "serde"] }
popui = { path = "../../popui" }
getrandom = { version = "0.2.17", features = ["custom"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = "1"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
url = "2"
webpki-roots = "1"
taffy = { version = "0.14", default-features = false, features = ["alloc", "flexbox", "taffy_tree"] }
