[package]
name = "twitch-radio"
version.workspace = true
edition.workspace = true

[[bin]]
name = "twitch-radio"
path = "src/main.rs"

[build-dependencies]

[dependencies]
dlmalloc = "0.2.14"
getrandom = { version = "0.2.17", features = ["custom"] }
libm = "0.2"
reqwest = { version = "=0.12.26", default-features = false, features = ["json", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac"] }
tokio = { version = "1.53.1", default-features = false, features = ["net", "rt", "sync", "time"] }
webpki-roots = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("popugos"))'] }
