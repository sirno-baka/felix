[package]
name = "felix-kernel"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
interrupt-sync = { path = "../interrupt-sync" }
elf = { version = "0.7.4", default-features = false}
bitflags = "1.3"
embedded-graphics = "0.8.2"
smoltcp = { version = "0.11", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-raw",
    "socket-udp",
    "socket-tcp",
    "socket-icmp",
    "alloc",
    "fragmentation-buffer-size-65536",
    "assembler-max-segment-count-16",
] }
# 0.3.6 needs core_io (broken on modern nightly). 0.4 has native Read/Write/Seek.
fatfs = { git = "https://github.com/rafalh/rust-fatfs", default-features = false, features = ["alloc", "lfn"] }
wasmi = { version = "0.31", default-features = false }
libm = "0.2"